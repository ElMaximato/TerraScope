<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TerraScope - Elegir ubicación</title>
<link rel="stylesheet" href="leaflet.css">
<style>
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #EEF2F0; }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #EEF2F0; }
  .pin { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; background: #0F4D3A; border: 3px solid #fff;
         transform: rotate(-45deg); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="map"></div>
<script src="config.js"></script>
<script src="leaflet.js"></script>
<script>
(function () {
  'use strict';
  var KEY = (window.TERRA_CONFIG && window.TERRA_CONFIG.cartoKey) || '';
  var TILE_URL = 'https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png' + (KEY ? '?key=' + KEY : '');
  var map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 11, maxZoom: 19, zoomSnap: 0.5 });
  map.setView([32.5975, -114.71], 14);
  map.setMaxBounds([[32.50, -114.85], [32.70, -114.58]]);
  L.tileLayer(TILE_URL, { maxZoom: 20, detectRetina: true }).addTo(map);

  var marker = null;
  var icon = L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [22, 22], iconAnchor: [11, 22] });

  function put(lat, lon, notify) {
    if (marker) marker.setLatLng([lat, lon]); else marker = L.marker([lat, lon], { icon: icon }).addTo(map);
    if (notify && window.Android && typeof window.Android.onPick === 'function') window.Android.onPick(lat, lon);
  }
  map.on('click', function (e) { put(e.latlng.lat, e.latlng.lng, true); });

  window.Picker = {
    setSize: function (w, h) {
      if (!w || !h) return;
      var el = document.getElementById('map');
      el.style.width = w + 'px'; el.style.height = h + 'px';
      map.invalidateSize(false);
    },
    setMarker: function (lat, lon) { put(lat, lon, false); map.setView([lat, lon], Math.max(map.getZoom(), 15)); },
    zoomIn: function () { map.zoomIn(); },
    zoomOut: function () { map.zoomOut(); }
  };
  window.addEventListener('load', function () { map.invalidateSize(false); });
})();
</script>
</body>
</html>
